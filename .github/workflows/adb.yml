name: Build ADB for ARM64 (musl)

on:
  workflow_dispatch:

jobs:
  build-adb:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc g++ autoconf automake libtool \
            pkg-config python3 python3-dev file wget

      - name: Download musl-cross
        run: |
          wget https://github.com/elitrycraft/Test/releases/download/11/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Verify cross-compiler
        run: aarch64-linux-musl-gcc --version

      - name: Build ADB
        run: |
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          
          echo -e "\n>> >>> ADB for ARM (musl) <<< \n"
          
          # Клонируем ADB
          git clone --depth 1 https://android.googlesource.com/platform/system/adb
          
          # Клонируем зависимости
          git clone --depth 1 https://android.googlesource.com/platform/system/libbase
          git clone --depth 1 https://android.googlesource.com/platform/system/logging
          git clone --depth 1 https://android.googlesource.com/platform/system/core
          
          # Собираем libcutils (из core)
          cd core/libcutils
          make CC=$CC CXX=$CXX AR=$AR LD=$LD RANLIB=$RANLIB \
               CFLAGS="-static -Os -I.. -I../../libbase/include" \
               libcutils.a
          cd ../..
          
          # Собираем liblog (из logging)
          cd logging/liblog
          make CC=$CC CXX=$CXX AR=$AR LD=$LD RANLIB=$RANLIB \
               CFLAGS="-static -Os -I.. -I../../libbase/include" \
               liblog.a
          cd ../..
          
          # Создаём Makefile для ADB
          cat > adb/Makefile << 'EOF'
          CC = aarch64-linux-musl-gcc
          CXX = aarch64-linux-musl-g++
          AR = aarch64-linux-musl-ar
          CFLAGS = -static -Os -I. -I../libbase/include -I../logging/liblog/include -I../core/libcutils/include
          LDFLAGS = -static -s -lpthread
          
          # Находим все .cpp файлы
          SOURCES = $(wildcard *.cpp) $(wildcard client/*.cpp) $(wildcard daemon/*.cpp) $(wildcard sysdeps/*.cpp)
          OBJECTS = $(SOURCES:.cpp=.o)
          
          all: adb
          
          adb: $(OBJECTS)
          	$(CXX) $(LDFLAGS) -o adb $(OBJECTS) ../core/libcutils/libcutils.a ../logging/liblog/liblog.a
          
          %.o: %.cpp
          	$(CXX) $(CFLAGS) -c $< -o $@
          
          clean:
          	rm -f adb $(OBJECTS)
          EOF
          
          # Собираем ADB
          cd adb
          make -j$(nproc)
          
          file adb
          ls -lh adb
          ./adb version || echo "Built!"
          
          cp adb ../
          cd ..
          
          echo -e "\n>> FINISH!\n"

      - name: Upload adb
        uses: actions/upload-artifact@v4
        with:
          name: adb-arm64-musl
          path: adb
