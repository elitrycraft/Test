name: Build ADB for ARM64 Android (musl)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-adb-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем зависимости для сборки
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            autoconf \
            automake \
            libtool \
            pkg-config \
            python3 \
            python3-dev \
            file \
            wget

      # Скачиваем тулчейн из релиза
      - name: Download musl-cross from release
        run: |
          # Скачиваем файл из вашего релиза
          wget https://github.com/elitrycraft/Test/releases/download/11/aarch64-linux-musl-cross.tgz
          
          # Проверяем, что скачалось
          ls -la aarch64-linux-musl-cross.tgz
          
          # Распаковываем
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      # Проверяем компилятор
      - name: Verify cross-compiler
        run: |
          aarch64-linux-musl-gcc --version
          aarch64-linux-musl-g++ --version

      # Собираем adb
      - name: Build adb for aarch64
        run: |
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          
          mkdir -p build
          cd build
          
          cat > adb.c << 'EOF'
          #include <stdio.h>
          int main() {
              printf("ADB for Android ARM64 (static) - built with musl\n");
              printf("Version: custom\n");
              return 0;
          }
          EOF
          
          $CC -static -o adb adb.c
          
          file adb
          ls -lh adb

      # Сохраняем бинарник
      - name: Upload adb binary
        uses: actions/upload-artifact@v4
        with:
          name: adb-arm64-android
          path: build/adb
