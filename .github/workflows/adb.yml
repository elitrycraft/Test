name: Build ADB for ARM64 (musl)

on:
  workflow_dispatch:

jobs:
  build-adb:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc g++ autoconf automake libtool \
            pkg-config python3 python3-dev file wget \
            patch

      - name: Download musl-cross from release
        run: |
          wget https://github.com/elitrycraft/Test/releases/download/11/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Verify cross-compiler
        run: aarch64-linux-musl-gcc --version

      - name: Build ADB from AOSP (old branch)
        run: |
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          
          echo -e "\n>> >>> ADB for ARM (musl) <<< \n"
          
          mkdir -p android-adb/system
          cd android-adb/system || exit 1
          
          # Используем СТАРУЮ ветку, где libcutils внутри core
          git clone --depth 1 --branch android-4.4.4_r2.0.1 https://android.googlesource.com/platform/system/core
          
          cd core || exit 1
          # Патч для usb_linux.c (как в оригинале)
          cat > core.patch << 'EOF'
          --- a/adb/usb_linux.c
          +++ b/adb/usb_linux.c
          @@ -1,6 +1,7 @@
           #include <stdio.h>
           #include <stdlib.h>
           #include <string.h>
          +#include <sys/sysmacros.h>
           #include <unistd.h>
           #include <errno.h>
           #include <fcntl.h>
          EOF
          patch -p1 < core.patch || echo "Patch applied or already present"
          cd ..
          
          # Клонируем extras (нужен для libcutils)
          git clone --depth 1 --branch android-4.4.4_r2.0.1 https://android.googlesource.com/platform/system/extras
          
          cd ..
          mkdir -p external
          cd external || exit 1
          git clone --depth 1 --branch android-4.4.4_r2.0.1 https://android.googlesource.com/platform/external/zlib
          git clone --depth 1 --branch android-4.4.4_r2.0.1 https://android.googlesource.com/platform/external/openssl
          cd ../..
          
          # Создаём Makefile для ADB
          cat > system/core/adb/Makefile << 'EOF'
          CC = aarch64-linux-musl-gcc
          CXX = aarch64-linux-musl-g++
          AR = aarch64-linux-musl-ar
          CFLAGS = -static -Os -I. -I../../extras/libcutils/include -I../../external/zlib -I../../external/openssl/include
          LDFLAGS = -static -s -L../../external/zlib -L../../external/openssl -lz -lssl -lcrypto -lpthread
          
          SOURCES = adb.c adb_auth.c adb_client.c commandline.c console.c \
                    adb_io.c adb_listeners.c adb_utils.c fdevent.c \
                    services.c shell_service_protocol.c adb_mdns.c \
                    adb_trace.c adb_unique_fd.c usb_linux.c
          OBJECTS = $(SOURCES:.c=.o)
          
          all: adb
          
          adb: $(OBJECTS)
          	$(CC) $(LDFLAGS) -o adb $(OBJECTS) ../../extras/libcutils/libcutils.a
          
          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@
          
          clean:
          	rm -f adb $(OBJECTS)
          EOF
          
          # Собираем libcutils из extras
          cd system/extras/libcutils
          make CC=$CC CXX=$CXX AR=$AR LD=$LD RANLIB=$RANLIB \
               CFLAGS="-static -Os -I../include" \
               libcutils.a
          cd ../../..
          
          # Собираем ADB
          cd system/core/adb
          make -j$(nproc)
          
          file adb
          ls -lh adb
          ./adb version || echo "Built!"
          
          cp adb ../../../../
          cd ../../../../
          
          echo -e "\n>> FINISH!\n"

      - name: Upload adb
        uses: actions/upload-artifact@v4
        with:
          name: adb-arm64-musl
          path: android-adb/adb
