name: Build ADB for ARM64 (musl)

on:
  workflow_dispatch:

jobs:
  build-adb:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc g++ autoconf automake libtool \
            pkg-config python3 python3-dev file wget \
            patch

      - name: Download musl-cross from release
        run: |
          wget https://github.com/elitrycraft/Test/releases/download/11/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Verify cross-compiler
        run: aarch64-linux-musl-gcc --version

      - name: Build ADB from AOSP
        run: |
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export LD=aarch64-linux-musl-ld
          export RANLIB=aarch64-linux-musl-ranlib
          export CFLAGS="-static -Os"
          export LDFLAGS="-static -s"
          
          echo -e "\n>> >>> ADB for ARM (musl) <<< \n"
          
          # Создаём структуру папок
          mkdir -p android-adb/system
          cd android-adb/system || exit 1
          
          # Клонируем core (там лежит adb)
          git clone --depth 1 https://android.googlesource.com/platform/system/core
          cd core || exit 1
          
          # Клонируем libcutils (в новых версиях он отдельно)
          cd ..
          git clone --depth 1 https://android.googlesource.com/platform/system/libcutils
          
          # Клонируем liblog
          git clone --depth 1 https://android.googlesource.com/platform/system/logging
          
          cd ..
          mkdir -p external
          cd external || exit 1
          
          # Клонируем зависимости
          git clone --depth 1 https://android.googlesource.com/platform/external/zlib
          git clone --depth 1 https://android.googlesource.com/platform/external/openssl
          cd ..
          
          # Создаём Makefile для ADB
          cat > system/core/adb/Makefile << 'EOF'
          CC = aarch64-linux-musl-gcc
          CXX = aarch64-linux-musl-g++
          AR = aarch64-linux-musl-ar
          CFLAGS = -static -Os -I. -I../../libcutils/include -I../../logging/liblog/include -I../../external/zlib -I../../external/openssl/include
          LDFLAGS = -static -s -L../../external/zlib -L../../external/openssl -lz -lssl -lcrypto -lpthread
          
          SOURCES = adb.c adb_auth.c adb_client.c commandline.c console.c \
                    adb_io.c adb_listeners.c adb_utils.c fdevent.c \
                    services.c shell_service_protocol.c adb_mdns.c \
                    adb_trace.c adb_unique_fd.c usb_linux.c
          OBJECTS = $(SOURCES:.c=.o)
          
          all: adb
          
          adb: $(OBJECTS)
          	$(CC) $(LDFLAGS) -o adb $(OBJECTS) ../../libcutils/libcutils.a ../../logging/liblog/liblog.a
          
          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@
          
          clean:
          	rm -f adb $(OBJECTS)
          EOF
          
          # Собираем libcutils
          cd system/libcutils
          make CC=$CC CXX=$CXX AR=$AR LD=$LD RANLIB=$RANLIB \
               CFLAGS="-static -Os -I.. -I../libcutils/include" \
               libcutils.a
          cd ../..
          
          # Собираем liblog
          cd system/logging/liblog
          make CC=$CC CXX=$CXX AR=$AR LD=$LD RANLIB=$RANLIB \
               CFLAGS="-static -Os -I.." \
               liblog.a
          cd ../../..
          
          # Собираем ADB
          cd system/core/adb
          make -j$(nproc)
          
          # Проверяем
          file adb
          ls -lh adb
          ./adb version || echo "Built!"
          
          # Копируем результат
          cp adb ../../../../
          cd ../../../../
          
          echo -e "\n>> FINISH!\n"

      - name: Upload adb
        uses: actions/upload-artifact@v4
        with:
          name: adb-arm64-musl
          path: android-adb/adb
