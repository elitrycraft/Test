name: Build Real ADB for ARM64 Android (musl)

on:
  workflow_dispatch:

jobs:
  build-adb-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc g++ autoconf automake libtool \
            pkg-config python3 python3-dev file wget \
            cmake ninja-build zip unzip

      - name: Download musl-cross from release
        run: |
          wget https://github.com/elitrycraft/Test/releases/download/11/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Verify cross-compiler
        run: aarch64-linux-musl-gcc --version

      - name: Clone and build real ADB
        run: |
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          export AR=aarch64-linux-musl-ar
          export LD=aarch64-linux-musl-ld
          
          # Клонируем упрощённый репозиторий с ADB
          git clone --depth 1 https://github.com/pberkus/android-tools
          cd android-tools/adb
          
          # Патчим Makefile для статической сборки под ARM64
          sed -i 's/CFLAGS =/CFLAGS = -static -Os -I..\/include/g' Makefile
          sed -i 's/LDFLAGS =/LDFLAGS = -static -s/g' Makefile
          
          # Собираем
          make CC=$CC CXX=$CXX AR=$AR LD=$LD
          
          # Проверяем
          file adb
          ls -lh adb

      - name: Upload real adb
        uses: actions/upload-artifact@v4
        with:
          name: real-adb-arm64
          path: android-tools/adb/adb
