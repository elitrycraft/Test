name: Convert Logo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install converter
        run: |
          pip install logoextractor  # Установка пакета для конвертации logo.bin

      - name: Run extraction
        run: |
          # Команда для распаковки logo.bin в папку output
          logoextractor --input logo.bin --output extracted_logos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-images
          path: extracted_logos/
          if-no-files-found: error
