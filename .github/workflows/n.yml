name: Convert Logo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mtkclient
        run: |
          git clone https://github.com/bkerler/mtkclient.git
          cd mtkclient
          pip install -r requirements.txt

      - name: Extract logo.bin
        run: |
          # Используем модуль Logo из mtkclient для распаковки
          python -m mtkclient.Logo logo.bin --output-dir extracted_logos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-images
          path: extracted_logos/
          if-no-files-found: error
