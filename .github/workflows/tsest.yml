name: Build all Nim tools for ARM64 musl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-nim-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            build-essential \
            git \
            wget \
            xz-utils \
            libssl-dev \
            pkg-config \
            file

      - name: Install Nim bootstrap (x86_64)
        run: |
          wget https://nim-lang.org/download/nim-2.0.2-linux_x64.tar.xz
          tar -xf nim-2.0.2-linux_x64.tar.xz
          mv nim-2.0.2 /opt/nim
          export PATH=/opt/nim/bin:$PATH
          echo "/opt/nim/bin" >> $GITHUB_PATH

      - name: Build Nim from source (ARM64 + musl)
        run: |
          git clone https://github.com/nim-lang/Nim.git
          cd Nim
          git checkout v2.0.2

          # Собираем koch
          /opt/nim/bin/nim c -d:release -o:bin/koch koch.nim

          # Сборка самого Nim под ARM64 с musl
          # Используем --cc:gcc, но передаём флаги статической сборки
          ./bin/koch boot -d:release \
            --cc:gcc \
            --passC:"-static -O2 -pipe -fno-strict-aliasing" \
            --passL:"-static"

          # Проверяем результат
          file bin/nim

          # Копируем в /opt/nim-arm64
          mkdir -p /opt/nim-arm64
          cp bin/nim /opt/nim-arm64/
          cp -r lib /opt/nim-arm64/
          cp -r config /opt/nim-arm64/
          cp -r compiler /opt/nim-arm64/
          cp -r tools /opt/nim-arm64/

          echo "/opt/nim-arm64" >> $GITHUB_PATH
        shell: /usr/bin/bash -e {0}

      - name: Build all tools
        run: |
          export PATH=/opt/nim-arm64:$PATH
          /opt/nim-arm64/nim --version

          cd /opt/nim-arm64
          TOOLS="nimble nimsuggest nimpretty nimgrep testament atlas"

          for tool in $TOOLS; do
            echo "🔨 Building $tool..."
            /opt/nim-arm64/nim c -d:release \
              --cpu:arm64 --os:linux \
              --gcc.exe:musl-gcc \
              --gcc.linkerexe:musl-gcc \
              --passC:-static \
              --passL:-static \
              -o:/opt/nim-arm64/$tool \
              tools/$tool.nim
          done

          cp tools/nim-gdb /opt/nim-arm64/ 2>/dev/null || echo "nim-gdb not found"
          if [ -f bin/nim_dbg ]; then
            cp bin/nim_dbg /opt/nim-arm64/
          else
            echo "nim_dbg not found, skipping"
          fi

      - name: Verify binaries
        run: |
          cd /opt/nim-arm64
          echo "📦 Проверяем все бинарники:"
          for f in nim nimble nimsuggest nimpretty nimgrep testament atlas nim-gdb nim_dbg; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              TYPE=$(file "$f" | grep -o 'ELF.*' || echo "script")
              echo "✅ $f — $SIZE — $TYPE"
            else
              echo "❌ $f не найден"
            fi
          done

      - name: Package everything
        run: |
          cd /opt/nim-arm64
          mkdir -p nim-tools-arm64-musl
          cp nim nimble nimsuggest nimpretty nimgrep testament atlas nim-gdb nim_dbg nim-tools-arm64-musl/ 2>/dev/null || true
          cp -r lib config compiler tools nim-tools-arm64-musl/ 2>/dev/null || true
          tar -czf /tmp/nim-tools-arm64-musl.tar.gz nim-tools-arm64-musl/
          echo "📦 Архив создан: /tmp/nim-tools-arm64-musl.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nim-tools-arm64-musl
          path: /tmp/nim-tools-arm64-musl.tar.gz
          retention-days: 30
